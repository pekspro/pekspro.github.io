title: PEK's developer blog
email: 
description: >- # this means to ignore newlines until "baseurl:"
  Interesting problems with interesting solutions.

url: "https://pekspro.github.io"
baseurl: ""

# github_username: pekspro

show_excerpts: true
# paginate: 10
# paginate_path: "/blog/page:num/"
timezone: Europe/Stockholm

author:
  name: PEK
  email: ""

minima:
  date_format: "%b %-d, %Y"
  skin: classic

  # generate social links in footer
  social_links:
    - { platform: github,  user_url: "https://github.com/pekspro/pekspro.github.io" }

header_pages:
  - about.md
  - categories.md

markdown: kramdown
theme: minima
plugins:
  - jekyll-timeago

defaults:
  -
    scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title

